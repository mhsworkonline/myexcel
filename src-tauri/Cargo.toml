[package]
name = "myexcel"
version = "0.1.0"
description = "MyExcel - local-first spreadsheet"
edition = "2021"

[lib]
name = "myexcel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-persisted-scope = "2"

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = "0.62"
clipboard-win = "5"
